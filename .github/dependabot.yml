version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[actions] '
  - package-ecosystem: 'docker'
    directory: '/'
    # Note: only bumps the nginx base-image FROM digest/tag.
    # sigsci-agent (apt-installed, SIGSCI_AGENT_VERSION) is NOT covered here.
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[docker] '
