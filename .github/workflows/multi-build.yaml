# Builds and pushes the multi-architecture (amd64/arm64) nginx-sigsci image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
name: Build multi-architecture image

on:
  schedule:
    # 0517 AWST, Mon-Fri
    - cron: '17 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push image to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,event=branch,branch=dev
            type=semver,pattern={{version}}

      - name: Build and push with bake
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TAGS_JSON=$(printf '%s\n' "$TAGS" | awk 'NF' | jq -R . | jq -s -c .)
          printf 'target "app" {\n  tags = %s\n}\n' "$TAGS_JSON" > /tmp/bake-tags.hcl
          docker buildx bake --push -f docker-bake.hcl -f /tmp/bake-tags.hcl
